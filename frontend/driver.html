<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard | Ride System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-2: #8b5cf6;
            --accent-hover: #a78bfa;
            --success: #10b981;
            --error: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(0, 0, 0, 0.2);
        }

        body {
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top left, rgba(139, 92, 246, 0.15), transparent 40%);
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            box-sizing: border-box;
        }

        .dashboard {
            width: 100%;
            max-width: 550px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            margin-top: 2rem;
        }

        .dashboard::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-2), transparent);
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-group { position: relative; margin-bottom: 1.5rem; }
        .form-group input {
            width: 100%; padding: 1rem; border-radius: 12px;
            border: 1px solid var(--glass-border); background: var(--input-bg);
            color: var(--text-main); font-family: inherit; font-size: 1rem;
            box-sizing: border-box; outline: none; transition: all 0.3s ease;
        }
        .form-group input:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); }
        .form-group label {
            position: absolute; top: 50%; left: 1rem; transform: translateY(-50%);
            color: var(--text-muted); font-size: 1rem; pointer-events: none; transition: all 0.3s ease;
        }
        .form-group input:focus + label, .form-group input:not(:placeholder-shown) + label {
            top: -0.5rem; left: 0.8rem; font-size: 0.8rem; background: var(--bg-dark);
            padding: 0 0.4rem; color: var(--accent-2); border-radius: 4px;
        }

        button {
            width: 100%; background: var(--accent-2); color: #fff;
            border: none; padding: 1rem; border-radius: 12px; font-size: 1.1rem;
            font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(139, 92, 246, 0.39);
        }
        button:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5); }
        button:active { transform: translateY(1px); }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            box-shadow: none;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.05); color: #fff; box-shadow: none; }

        #active-section { display: none; }
        
        .driver-id-badge {
            display: inline-block; background: rgba(255, 255, 255, 0.1);
            padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.9rem;
            margin-bottom: 2rem; color: var(--text-muted);
        }
        .driver-id-badge span { color: #fff; font-weight: 600; }

        /* Offers Board */
        #offers-box {
            display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;
        }
        .offer-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 16px;
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
            overflow: hidden;
        }
        .offer-card::after {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent-2);
        }
        .offer-card:hover { border-color: rgba(139, 92, 246, 0.4); background: rgba(139, 92, 246, 0.05); }

        .offer-header { display: flex; justify-content: space-between; align-items: center; }
        .offer-header strong { font-size: 1.2rem; color: #fff; }
        .offer-badge { background: rgba(139, 92, 246, 0.2); color: var(--accent-hover); padding: 0.2rem 0.6rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600; }
        
        .offer-details { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }
        
        .btn-accept {
            background: linear-gradient(135deg, var(--success), #34d399);
            box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.3);
            margin-top: 0.5rem;
        }
        .btn-accept:hover { background: #34d399; box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }

        /* Status Logs */
        #status-box { margin-top: 2rem; display: none; }
        .log-entry {
            background: rgba(255, 255, 255, 0.05); border-left: 3px solid var(--accent-2);
            padding: 0.8rem 1rem; border-radius: 6px; margin-bottom: 0.8rem; font-size: 0.9rem;
            animation: slideRight 0.3s ease-out;
        }
        .log-entry.success { border-left-color: var(--success); background: rgba(16, 185, 129, 0.05); }
        .log-entry.error { border-left-color: var(--error); background: rgba(239, 68, 68, 0.05); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(50px) scale(0.9); } to { opacity: 1; transform: translateX(0) scale(1); } }
        @keyframes slideRight { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Driver Dashboard</h1>
        
        <div id="setup-section">
            <div class="form-group">
                <input type="text" id="d-name" placeholder=" " value="Jane Driver">
                <label>Full Name</label>
            </div>
            <div class="form-group">
                <input type="email" id="d-email" placeholder=" " value="jane@example.com">
                <label>Email Address</label>
            </div>
            <div class="form-group">
                <input type="text" id="d-phone" placeholder=" " value="555-9876">
                <label>Phone Number</label>
            </div>
            <button onclick="createDriver()">Go Online</button>
        </div>

        <div id="active-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="driver-id-badge">Driver ID: <span id="current-driver-id"></span></div>
                <div class="driver-id-badge" style="background: rgba(16, 185, 129, 0.1); color: var(--success);"><span style="color: var(--success);">● ONLINE</span></div>
            </div>
            
            <button class="btn-outline" onclick="fetchOffers()">↻ Refresh Board</button>
            
            <div id="offers-box">
                <!-- Offers will render here -->
            </div>
        </div>

        <div id="status-box">
            <div id="messages"></div>
        </div>
    </div>

    <script>
        let driverId = null;
        let ws = null;

        async function createDriver() {
            const btn = document.querySelector('#setup-section button');
            btn.innerText = "Connecting...";
            btn.style.opacity = '0.7';

            const name = document.getElementById('d-name').value;
            const email = document.getElementById('d-email').value.split('@')[0] + Math.floor(Math.random() * 1000) + '@example.com';
            const phone = document.getElementById('d-phone').value + Math.floor(Math.random() * 1000);

            const res = await fetch('/drivers/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, email, phone})
            });

            if(res.ok) {
                const data = await res.json();
                driverId = data.driver_id;
                
                document.getElementById('setup-section').style.display = 'none';
                document.getElementById('active-section').style.display = 'block';
                document.getElementById('current-driver-id').innerText = driverId;
                
                document.getElementById('status-box').style.display = 'block';
                addMessage("✅ Connection established. Waiting for offers...", "success");
                
                connectWebSocket();
                fetchOffers();
            } else {
                btn.innerText = "Go Online";
                btn.style.opacity = '1';
                alert("Failed to initialize driver.");
            }
        }

        function connectWebSocket() {
            ws = new WebSocket(`ws://${window.location.host}/ws/driver/${driverId}`);
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.type === 'new_offer') {
                    addMessage(`📡 High-priority offer incoming: Request #${data.request_id}`);
                    fetchOffers();
                }
            };
            ws.onopen = () => console.log("WebSocket connected");
        }

        async function fetchOffers() {
            const res = await fetch(`/drivers/${driverId}/offers`);
            if (res.ok) {
                const offers = await res.json();
                renderOffers(offers);
            }
        }

        function renderOffers(offers) {
            const box = document.getElementById('offers-box');
            box.innerHTML = '';
            
            if (offers.length === 0) {
                box.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin: 2rem 0;">No pending offers at the moment.</p>';
                return;
            }

            offers.forEach(o => {
                const card = document.createElement('div');
                card.className = 'offer-card';
                card.id = `offer-${o.offer_id}`;
                card.innerHTML = `
                    <div class="offer-header">
                        <strong>Request #${o.request_id}</strong>
                        <span class="offer-badge">NEW</span>
                    </div>
                    <div class="offer-details">
                        📍 Pickup: [${o.pickup_lat.toFixed(4)}, ${o.pickup_lon.toFixed(4)}]<br>
                        🏁 Dropoff: [${o.dropoff_lat.toFixed(4)}, ${o.dropoff_lon.toFixed(4)}]
                    </div>
                    <button class="btn-accept" onclick="acceptOffer(${o.offer_id}, ${o.request_id})">Accept Ride</button>
                `;
                box.appendChild(card);
            });
        }

        async function acceptOffer(offerId, requestId) {
            const card = document.getElementById(`offer-${offerId}`);
            if(card) card.style.opacity = '0.5';
            
            addMessage(`⏳ Attempting to lock Offer #${offerId}...`);
            
            const res = await fetch(`/offers/${offerId}/accept`, { method: 'POST' });
            const data = await res.json();
            
            if (res.ok) {
                addMessage(`🎉 LOCKED: You successfully acquired Request #${requestId}!`, "success");
                if(card) {
                    card.style.opacity = '1';
                    card.innerHTML = '<div style="text-align: center; color: var(--success); font-weight: 600; padding: 1rem 0;">✅ ASSIGNED TO YOU</div>';
                }
                setTimeout(fetchOffers, 2000);
            } else {
                if (res.status === 409 || res.status === 400) {
                    addMessage(`⚠️ MISSED: Another driver claimed Request #${requestId} first.`, "error");
                } else {
                    addMessage(`❌ ERROR: ${data.detail}`, "error");
                }
                if(card) card.remove();
            }
        }

        function addMessage(msg, type = 'normal') {
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.innerHTML = `<span>${msg}</span>`;
            document.getElementById('messages').prepend(div);
        }
    </script>
</body>
</html>
