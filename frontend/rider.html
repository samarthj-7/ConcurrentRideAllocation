<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Dashboard | Ride System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-1: #0ea5e9;
            --accent-hover: #38bdf8;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(0, 0, 0, 0.2);
        }

        body {
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, rgba(14, 165, 233, 0.15), transparent 40%);
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .dashboard {
            width: 100%;
            max-width: 450px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        /* Subtle glowing top border */
        .dashboard::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-1), transparent);
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1rem 1rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--input-bg);
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
        }

        .form-group label {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus + label,
        .form-group input:not(:placeholder-shown) + label {
            top: -0.5rem;
            left: 0.8rem;
            font-size: 0.8rem;
            background: var(--bg-dark);
            padding: 0 0.4rem;
            color: var(--accent-1);
            border-radius: 4px;
        }

        button {
            width: 100%;
            background: var(--accent-1);
            color: #fff;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(14, 165, 233, 0.39);
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            box-shadow: none;
            color: var(--text-muted);
        }
        .btn-outline:hover { background: rgba(255,255,255,0.05); color: #fff; box-shadow: none; }

        #request-section { display: none; text-align: center; }
        
        .rider-id-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            color: var(--text-muted);
        }
        
        .rider-id-badge span { color: #fff; font-weight: 600; }

        /* Status Logs */
        #status-box {
            margin-top: 2rem;
            display: none;
        }

        .log-entry {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--accent-1);
            padding: 0.8rem 1rem;
            border-radius: 6px;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
            animation: slideRight 0.3s ease-out;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .log-entry.success {
            border-left-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }
        
        .radar-container {
            position: relative;
            width: 80px; height: 80px;
            margin: 0 auto 1.5rem auto;
            display: none;
        }
        
        .radar {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(14, 165, 233, 0.3);
            position: absolute;
            top: 0; left: 0;
            animation: pulse 2s infinite;
        }
        .radar:nth-child(2) { animation-delay: 0.5s; }
        .radar:nth-child(3) { animation-delay: 1s; }

        @keyframes pulse {
            0% { transform: scale(0.1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideRight {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Rider Dashboard</h1>
        
        <div id="setup-section">
            <div class="form-group">
                <input type="text" id="r-name" placeholder=" " value="John Doe">
                <label>Full Name</label>
            </div>
            <div class="form-group">
                <input type="email" id="r-email" placeholder=" " value="john@example.com">
                <label>Email Address</label>
            </div>
            <div class="form-group">
                <input type="text" id="r-phone" placeholder=" " value="555-1234">
                <label>Phone Number</label>
            </div>
            <button onclick="createRider()">Initialize Rider</button>
            <button class="btn-outline" style="margin-top: 1rem;" onclick="window.location.href='/'">Back to Home</button>
        </div>

        <div id="request-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div class="rider-id-badge" style="margin-bottom: 0;">Rider ID: <span id="current-rider-id"></span></div>
                <button class="btn-outline" style="width: auto; padding: 0.4rem 1rem; margin-bottom: 0;" onclick="signOut()">Sign Out</button>
            </div>
            
            <div class="radar-container" id="radar">
                <div class="radar"></div>
                <div class="radar"></div>
                <div class="radar"></div>
            </div>
            
            <button id="request-btn" onclick="requestRide()">Request a Ride</button>
            <button id="cancel-btn" onclick="cancelRide()" style="display: none; background: #ef4444; margin-top: 1rem; box-shadow: 0 4px 14px 0 rgba(239, 68, 68, 0.39);">Cancel Ride</button>
        </div>

        <div id="status-box">
            <div id="messages"></div>
        </div>
    </div>

    <script>
        let riderId = null;
        let currentRequestId = null;
        let ws = null;

        async function createRider() {
            const btn = document.querySelector('#setup-section button');
            btn.innerText = "Initializing...";
            btn.style.opacity = '0.7';

            const name = document.getElementById('r-name').value;
            const email = document.getElementById('r-email').value.split('@')[0] + Math.floor(Math.random() * 1000) + '@example.com'; 
            const phone = document.getElementById('r-phone').value + Math.floor(Math.random() * 1000);

            const res = await fetch('/riders/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, email, phone})
            });

            if(res.ok) {
                const data = await res.json();
                riderId = data.rider_id;
                
                document.getElementById('setup-section').style.display = 'none';
                document.getElementById('request-section').style.display = 'block';
                document.getElementById('current-rider-id').innerText = riderId;
                
                connectWebSocket();
            } else {
                btn.innerText = "Initialize Rider";
                btn.style.opacity = '1';
                alert("Failed to create rider. Please try again.");
            }
        }

        function connectWebSocket() {
            ws = new WebSocket(`ws://${window.location.host}/ws/rider/${riderId}`);
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.type === 'ride_assigned') {
                    document.getElementById('radar').style.display = 'none';
                    const btn = document.getElementById('request-btn');
                    btn.style.display = 'block';
                    btn.innerText = "Ride Accepted!";
                    btn.style.background = 'var(--success)';
                    btn.style.boxShadow = '0 4px 14px 0 rgba(16, 185, 129, 0.39)';
                    
                    addMessage(`✅ Driver #${data.driver_id} is on the way!`, 'success');
                } else if (data.type === 'ride_cancelled') {
                    resetUI();
                    addMessage(`❌ ${data.message}`);
                } else if (data.type === 'ride_completed') {
                    resetUI();
                    addMessage(`🏁 ${data.message}`, 'success');
                }
            };
            ws.onopen = () => console.log("WebSocket connected");
        }

        async function requestRide() {
            const btn = document.getElementById('request-btn');
            btn.style.display = 'none';
            document.getElementById('radar').style.display = 'block';
            
            document.getElementById('status-box').style.display = 'block';
            addMessage("🔄 Broadcasting ride request to nearby drivers...");
            
            const res = await fetch('/requests/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    rider_id: riderId,
                    pickup_lat: 40.7128, pickup_lon: -74.0060,
                    dropoff_lat: 40.7306, dropoff_lon: -73.9352
                })
            });

            if(res.ok) {
                const data = await res.json();
                currentRequestId = data.request_id;
                addMessage(`📡 Request #${data.request_id} created. Waiting for acceptance...`);
                document.getElementById('cancel-btn').style.display = 'block';
            } else {
                document.getElementById('radar').style.display = 'none';
                btn.style.display = 'block';
                addMessage("❌ Failed to create request. Try again.");
            }
        }

        async function cancelRide() {
            if (!currentRequestId) return;
            const res = await fetch(`/requests/${currentRequestId}/cancel`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({cancelled_by: 'RIDER', reason: 'User requested cancellation'})
            });
            if(res.ok) {
                resetUI();
            } else {
                addMessage("❌ Failed to cancel ride.");
            }
        }

        function resetUI() {
            currentRequestId = null;
            document.getElementById('radar').style.display = 'none';
            document.getElementById('cancel-btn').style.display = 'none';
            const btn = document.getElementById('request-btn');
            btn.style.display = 'block';
            btn.innerText = "Request a Ride";
            btn.style.background = 'var(--accent-1)';
            btn.style.boxShadow = '0 4px 14px 0 rgba(14, 165, 233, 0.39)';
        }

        function signOut() {
            if (ws) {
                ws.close();
                ws = null;
            }
            window.location.href = '/';
        }

        function addMessage(msg, type = 'normal') {
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.innerHTML = `<span>${msg}</span>`;
            document.getElementById('messages').prepend(div);
        }
    </script>
</body>
</html>
