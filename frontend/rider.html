<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Dashboard</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .dashboard { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 12px; }
        h1 { color: #38bdf8; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #94a3b8; }
        input { width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 1rem; }
        button:hover { background: #7dd3fc; }
        #status-box { margin-top: 2rem; padding: 1rem; background: #0f172a; border: 1px solid #334155; border-radius: 6px; display: none; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Rider Dashboard</h1>
        
        <div id="setup-section">
            <h3>Create Rider Profile</h3>
            <div class="form-group"><label>Name</label><input type="text" id="r-name" value="John Doe"></div>
            <div class="form-group"><label>Email</label><input type="email" id="r-email" value="john@example.com"></div>
            <div class="form-group"><label>Phone</label><input type="text" id="r-phone" value="555-1234"></div>
            <button onclick="createRider()">Initialize Rider</button>
        </div>

        <div id="request-section" style="display: none;">
            <h3>Request a Ride</h3>
            <p>Your Rider ID: <span id="current-rider-id"></span></p>
            <button onclick="requestRide()">Request Ride Now</button>
        </div>

        <div id="status-box">
            <h3 style="margin-top: 0; color: #fcd34d;">Status Updates</h3>
            <div id="messages"></div>
        </div>
    </div>

    <script>
        let riderId = null;
        let ws = null;

        async function createRider() {
            const name = document.getElementById('r-name').value;
            const email = document.getElementById('r-email').value + Math.floor(Math.random() * 1000); // Randomize to avoid unique constraint in demo
            const phone = document.getElementById('r-phone').value + Math.floor(Math.random() * 1000);

            const res = await fetch('/riders/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, email, phone})
            });

            if(res.ok) {
                const data = await res.json();
                riderId = data.rider_id;
                document.getElementById('setup-section').style.display = 'none';
                document.getElementById('request-section').style.display = 'block';
                document.getElementById('current-rider-id').innerText = riderId;
                
                // Connect WebSocket
                connectWebSocket();
            } else {
                alert("Failed to create rider");
            }
        }

        function connectWebSocket() {
            ws = new WebSocket(`ws://${window.location.host}/ws/rider/${riderId}`);
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.type === 'ride_assigned') {
                    addMessage(`✅ SUCCESS: Driver ${data.driver_id} has accepted your request (Request ID: ${data.request_id})!`);
                }
            };
            ws.onopen = () => console.log("WebSocket connected");
        }

        async function requestRide() {
            document.getElementById('status-box').style.display = 'block';
            addMessage("🔄 Searching for drivers...");
            
            const res = await fetch('/requests/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    rider_id: riderId,
                    pickup_lat: 40.7128, pickup_lon: -74.0060,
                    dropoff_lat: 40.7306, dropoff_lon: -73.9352
                })
            });

            if(res.ok) {
                const data = await res.json();
                addMessage(`📡 Request ${data.request_id} created. Broadcasting to drivers...`);
            } else {
                addMessage("❌ Failed to create request.");
            }
        }

        function addMessage(msg) {
            const div = document.createElement('div');
            div.style.marginBottom = '10px';
            div.innerText = msg;
            document.getElementById('messages').prepend(div);
        }
    </script>
</body>
</html>
