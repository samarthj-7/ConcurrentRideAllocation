<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concurrent Ride Allocation System</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        h1 { font-size: 2.5rem; text-align: center; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .container { display: flex; gap: 2rem; margin-top: 3rem; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); text-align: center; transition: transform 0.2s; cursor: pointer; text-decoration: none; color: inherit; width: 250px; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(56, 189, 248, 0.2); }
        .card h2 { color: #38bdf8; }
        .card p { color: #94a3b8; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>Concurrent Ride Allocation System</h1>
    <p>A demonstration of PostgreSQL explicit concurrency control (Row-Level Locking).</p>

    <div class="container">
        <a href="/rider-dashboard" class="card">
            <h2>Rider Dashboard</h2>
            <p>Request rides and wait for a driver to be assigned.</p>
        </a>
        <a href="/driver-dashboard" class="card">
            <h2>Driver Dashboard</h2>
            <p>Receive real-time offers and attempt to accept them concurrently.</p>
        </a>
    </div>
</body>
</html>
